version: 7.0.4
type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - etsy_shop_receipts

definitions:
  authenticator:
    type: OAuthAuthenticator
    client_id: "{{ config['client_id'] }}"
    refresh_token: "{{ config['refresh_token'] }}"
    refresh_token_name: refresh_token
    grant_type: refresh_token
    token_refresh_endpoint: https://api.etsy.com/v3/public/oauth/token
    refresh_request_body:
      client_id: "{{ config['client_id'] }}"
  paginator:
    type: DefaultPaginator
    pagination_strategy:
      type: OffsetIncrement
      page_size: 100
      inject_on_first_request: true
    page_size_option:
      type: RequestOption
      field_name: limit
      inject_into: request_parameter
    page_token_option:
      type: RequestOption
      field_name: offset
      inject_into: request_parameter

streams:
  - type: DeclarativeStream
    name: etsy_shop_receipts
    primary_key:
      - receipt_id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        properties:
          receipt_id:
            type: integer
          status:
            type: [string, "null"]
          is_paid:
            type: [boolean, "null"]
          is_shipped:
            type: [boolean, "null"]
          create_timestamp:
            type: [integer, "null"]
          updated_timestamp:
            type: [integer, "null"]
          grandtotal:
            type: [object, "null"]
          refunds:
            type: [array, "null"]
          transactions:
            type: [array, "null"]
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://openapi.etsy.com/v3/application/
        path: "shops/{{ config['shop_id'] }}/receipts"
        http_method: GET
        authenticator: "#/definitions/authenticator"
        request_headers:
          x-api-key: "{{ config['api_key'] }}"
        request_parameters:
          min_created: "{{ config['start_timestamp'] }}"
          sort_on: created
          sort_order: asc
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: [results]
      paginator: "#/definitions/paginator"

  - type: DeclarativeStream
    name: etsy_active_listings
    primary_key:
      - listing_id
    schema_loader:
      type: InlineSchemaLoader
      schema:
        $schema: http://json-schema.org/schema#
        type: object
        additionalProperties: true
        properties:
          listing_id:
            type: integer
          title:
            type: [string, "null"]
          state:
            type: [string, "null"]
          url:
            type: [string, "null"]
          quantity:
            type: [integer, "null"]
          price:
            type: [object, "null"]
          views:
            type: [integer, "null"]
          num_favorers:
            type: [integer, "null"]
          creation_timestamp:
            type: [integer, "null"]
          updated_timestamp:
            type: [integer, "null"]
    retriever:
      type: SimpleRetriever
      requester:
        type: HttpRequester
        url_base: https://openapi.etsy.com/v3/application/
        path: "shops/{{ config['shop_id'] }}/listings"
        http_method: GET
        authenticator: "#/definitions/authenticator"
        request_headers:
          x-api-key: "{{ config['api_key'] }}"
        request_parameters:
          state: active
          sort_on: updated
          sort_order: desc
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path: [results]
      paginator: "#/definitions/paginator"

spec:
  type: Spec
  documentation_url: https://developers.etsy.com/documentation/reference/
  connection_specification:
    $schema: http://json-schema.org/draft-07/schema#
    type: object
    required: [shop_id, api_key, client_id, refresh_token, start_timestamp]
    properties:
      shop_id:
        type: string
        title: Etsy shop ID
        pattern: "^[0-9]+$"
        order: 0
      api_key:
        type: string
        title: Etsy API keystring and shared secret
        description: The x-api-key value in keystring:shared_secret format
        airbyte_secret: true
        order: 1
      client_id:
        type: string
        title: Etsy app keystring
        airbyte_secret: true
        order: 2
      refresh_token:
        type: string
        title: Etsy OAuth refresh token
        airbyte_secret: true
        order: 3
      start_timestamp:
        type: integer
        title: Earliest receipt creation time
        description: Unix timestamp in seconds
        order: 4
    additionalProperties: true

metadata:
  autoImportSchema:
    etsy_shop_receipts: false
    etsy_active_listings: false
