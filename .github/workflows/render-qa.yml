name: Render QA

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install video tooling
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run unit tests
        run: npm test

      - name: Render the single-page proof
        run: npm run render:example

      - name: Build a safe Claude ZIP fixture
        run: node scripts/create-ci-claude-zip.mjs work/ci-input.zip

      - name: Prepare jobs from the ZIP
        run: node dist/src/cli.js prepare-claude-zip work/ci-input.zip work/ci-jobs ci-fixture | tee work/ci-import-report.json

      - name: Render every requested social variant
        run: |
          for manifest in work/ci-jobs/*-source/manifest.json; do
            node dist/src/cli.js "$manifest"
          done

      - name: Verify multi-page QA reports
        run: |
          for report in work/ci-jobs/*-source/renders/qa-report.json; do
            node scripts/assert-qa.mjs "$report" 3
          done

      - name: Create visual contact sheets
        run: |
          for report in work/ci-jobs/*-source/renders/qa-report.json; do
            case "$report" in *reel-source*) continue ;; esac
            node scripts/create-contact-sheet.mjs "$report"
          done

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-qa-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            examples/static-design/renders/
            work/ci-import-report.json
            work/ci-jobs/*/renders/
