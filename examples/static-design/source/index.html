<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @font-face { font-family: "Dopa Proof Sans"; src: local("DejaVu Sans"); }
    * { box-sizing: border-box; }
    html, body { width: 1080px; height: 1350px; margin: 0; overflow: hidden; }
    body { font-family: "Dopa Proof Sans", sans-serif; background: #f2eadf; color: #1b2d27; }
    main { height: 100%; padding: 88px; display: grid; grid-template-rows: auto 1fr auto; border: 28px solid #1b2d27; }
    .eyebrow { font-size: 30px; letter-spacing: .22em; text-transform: uppercase; }
    .hero { align-self: center; }
    h1 { margin: 0; max-width: 820px; font-size: 128px; line-height: .92; letter-spacing: -.06em; }
    .orb { width: 210px; height: 210px; margin-top: 58px; border-radius: 50%; background: #ef643f; box-shadow: 230px 0 0 #eebc3c, 460px 0 0 #6da598; }
    footer { display: flex; justify-content: space-between; align-items: end; font-size: 26px; }
    footer span:last-child { font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Deterministic production proof</div>
    <section class="hero"><h1>Render what was approved.</h1><div class="orb"></div></section>
    <footer><span>1080 × 1350</span><span>DOPA / 001</span></footer>
  </main>
</body>
</html>
